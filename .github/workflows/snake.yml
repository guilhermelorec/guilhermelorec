name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas
  workflow_dispatch:          # botão para rodar manualmente
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#302b63&color_dots=#ebedf0,#9be9f8,#40c4ff,#0091ea,#01579b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00d4ff&color_dots=#161b22,#0d3b4f,#006d8f,#00a3cc,#00d4ff

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
